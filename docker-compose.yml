version: "3.8"

services:
  app:
    build:
      context: .
    container_name: copilot-qa-app
    ports:
      - "3000:3000"
    volumes:
      - sessions-data:/app/sessions
      - user-cloned-repos:/root/.copilot-sdk-demo/repos
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=http://localhost:3000
      - MODEL_URL=${MODEL_URL}
      - MODEL_API_KEY=${MODEL_API_KEY}
      - MODEL_PROVIDER=${MODEL_PROVIDER}
      - MODEL_WIRE_API=${MODEL_WIRE_API}
      - COPILOT_MODEL=${COPILOT_MODEL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sessions-data:
  user-cloned-repos:
